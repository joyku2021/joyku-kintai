<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Joykuアプリ出退勤 - QRを読む</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --sky: #6cd1f6; --rose: #d9476a; --text: #2b2b33; --muted: #7b7f8a; --line: #e6ecf2; }
    * { box-sizing: border-box; }
    html { background: var(--sky); }
    body {
      margin: 0; padding: 0 16px 48px; color: var(--text); min-height: 100vh;
      font-family: "M PLUS Rounded 1c", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; font-weight: 500;
      background-color: #fff;
      background-image: repeating-linear-gradient(-45deg,
        #fdf7dc 0 11px, #ffffff 11px 22px, #fbe8ee 22px 33px, #ffffff 33px 44px,
        #d2effa 44px 55px, #ffffff 55px 66px, #fcecd8 66px 77px, #ffffff 77px 88px,
        #f0e8f8 88px 99px, #ffffff 99px 110px, #eefae6 110px 121px, #ffffff 121px 132px);
      background-attachment: fixed;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    .appbar { position: sticky; top: 0; z-index: 10; margin: 0 -16px 18px; padding: 0 16px; min-height: 84px;
      display: flex; align-items: center; justify-content: center; background: var(--sky); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.14); }
    .appbar .title { font-size: 22px; font-weight: 800; letter-spacing: .04em; }
    .sub { color: var(--muted); font-size: 15px; margin: 0; padding: 14px 0 22px; text-align: center; }
    .card { background: #fff; border-radius: 22px; padding: 18px 16px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.10); }
    #reader { width: 100%; border-radius: 16px; overflow: hidden; background: #000; min-height: 260px; }
    #reader video { width: 100% !important; border-radius: 16px; }
    button { width: 100%; font-size: 17px; font-weight: 800; padding: 14px; border-radius: 999px; border: none; color: #fff;
      background: var(--sky); box-shadow: 0 4px 12px rgba(0,0,0,.16); font-family: inherit; margin-top: 12px; }
    button:disabled { opacity: .45; box-shadow: none; }
    .msg { margin-top: 12px; font-size: 14px; min-height: 1.5em; font-weight: 700; }
    .msg.err { color: var(--rose); }
    .note { font-size: 13px; color: var(--muted); }
    .footer { text-align: center; margin-top: 24px; font-size: 15px; color: var(--muted); }
    .footer a { color: var(--rose); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .hidden { display: none !important; }
    #tokenBox { font-size: 12px; word-break: break-all; background: #f7fafc; border: 2px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="appbar"><div class="title">Joykuアプリ出退勤</div></div>
  <p class="sub">施設に掲示されているQRコードを読み取ってください</p>

  <div class="card">
    <div id="reader"></div>
    <button id="startBtn">カメラを起動する</button>
    <div class="msg" id="msg"></div>
    <div class="note" style="margin-top:8px">カメラの許可を求められたら「許可」を選んでください。読み取れたら自動で出退勤ページに移動します。</div>
  </div>

  <!-- 登録モード（運営用：URL末尾に #reg を付けると表示） -->
  <div class="card hidden" id="regCard">
    <div class="note">登録モード：読み取った内容を表示します（出退勤ページには移動しません）</div>
    <div id="tokenBox">—</div>
    <button id="copyBtn" disabled>コピー</button>
  </div>

  <p class="footer">うまく読めない場合は <a href="https://lin.ee/6BPrz2u" target="_blank" rel="noopener">Joyku運営事務局</a> までご連絡ください。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
  // ★ ここに出退勤ページ（Apps Script のウェブアプリURL、.../exec）を貼る
  const ATTENDANCE_URL = 'https://script.google.com/macros/s/AKfycbyOHLGqRLo6UolMFVwq4f7DqlHKAf8cQUpuPVl5V5c9lQnKTxMfgI7motFaJwp_queh/exec';

  const REG_MODE = location.hash === '#reg';
  const $ = (id) => document.getElementById(id);
  if (REG_MODE) $('regCard').classList.remove('hidden');

  let scanner = null, done = false, lastText = '';

  function go(text) {
    if (done) return;
    text = String(text || '').trim();
    if (!text) return;
    if (REG_MODE) {
      lastText = text;
      $('tokenBox').textContent = text;
      $('copyBtn').disabled = false;
      $('msg').textContent = '読み取りました。コピーしてシートに貼ってください。';
      return;
    }
    done = true;
    $('msg').textContent = '読み取りました。移動します…';
    let url;
    // 出退勤ページのURL（?f= / &j= 付き）がそのまま入っているQRならそれへ、それ以外はトークンとして渡す
    if (/^https?:\/\/script\.google\.com\//.test(text)) url = text;
    else url = ATTENDANCE_URL + '?t=' + encodeURIComponent(text);
    try { scanner && scanner.stop().catch(() => {}); } catch (e) {}
    location.href = url;
  }

  $('startBtn').onclick = async () => {
    $('startBtn').disabled = true;
    $('msg').className = 'msg'; $('msg').textContent = 'カメラを起動中…';
    try {
      scanner = new Html5Qrcode('reader');
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (w, h) => { const s = Math.min(w, h) * 0.8; return { width: s, height: s }; } },
        go,
        () => {}
      );
      $('msg').textContent = 'QRコードを枠内に入れてください';
    } catch (e) {
      $('startBtn').disabled = false;
      $('msg').className = 'msg err';
      $('msg').textContent = 'カメラを起動できませんでした。ブラウザのカメラ許可を確認し、Safari（iPhone）または Chrome（Android）で開いてください。';
    }
  };

  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(lastText); $('msg').textContent = 'コピーしました'; }
    catch (e) { $('msg').textContent = '長押しで選択してコピーしてください'; }
  };
</script>
</body>
</html>
